<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>팀 공유 권한</title><link rel="stylesheet" href="./css/app.css"><style>.wrap{max-width:760px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.scopes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}.scope{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px}.scope input{width:auto}.notice{background:#fff8df;border:1px solid #f0d57a;border-radius:12px;padding:12px;font-size:13px}.matrix{width:100%;border-collapse:collapse}.matrix td,.matrix th{padding:9px;border-bottom:1px solid var(--line);text-align:left}@media(max-width:600px){.grid,.scopes{grid-template-columns:1fr}}</style></head><body><header><div><small>관리자 설정</small><h1>팀 공유 권한</h1></div></header><main class="wrap">
<section id="connectCard" class="card"><h2>Supabase 연결</h2><div class="grid"><label>Project URL<input id="sbUrl"></label><label>Publishable key<input id="sbKey"></label><label>관리자 이메일<input id="email" type="email"></label><label>비밀번호<input id="password" type="password"></label></div><button id="connectBtn" class="primary">연결하고 로그인</button><div id="connectError" class="error"></div></section>
<section id="permissionCard" class="card" hidden><h2>누가 누구를 볼 수 있나요?</h2><p class="notice">기본은 비공개입니다. 같은 팀이어도 아래에서 허용한 대상과 항목만 볼 수 있습니다.</p><div class="grid"><label>팀<select id="teamSelect"></select></label><label>열람자<select id="viewerSelect"></select></label><label>데이터 소유자<select id="ownerSelect"></select></label><label>권한<select id="modeSelect"><option value="read">읽기만</option><option value="write">읽기·수정</option></select></label></div><div id="scopeList" class="scopes"></div><button id="saveBtn" class="primary">공유 권한 저장</button><h2 style="margin-top:24px">현재 허용 관계</h2><div style="overflow:auto"><table class="matrix"><thead><tr><th>열람자</th><th>대상</th><th>공유 항목</th><th>권한</th></tr></thead><tbody id="grantRows"></tbody></table></div></section>
</main><script type="module" src="./js/team-permissions.js"></script></body></html>
