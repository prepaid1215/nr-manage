<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5b55b9"><title>NRC 사업관리</title><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="icon" href="./icon-192.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="./css/app.css?v=20260916-11"></head><body>
<script>if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));</script>
<div id="loginView" class="auth" hidden><form id="loginForm" class="auth-card"><div class="logo">NRC</div><h1>사업관리 시스템</h1><p id="authDescription">아이디와 비밀번호로 로그인하세요.</p><label class="signup-only" hidden>이름<input id="signupName" maxlength="40" autocomplete="name"></label><label class="signup-only" hidden>회원번호<input id="signupMemberNo" minlength="4" maxlength="20" inputmode="numeric" pattern="[0-9]+"></label><label>아이디<input id="loginUsername" minlength="4" maxlength="30" pattern="[A-Za-z0-9._-]+" autocomplete="username" autocapitalize="none" required></label><label>비밀번호<input id="loginPassword" type="password" minlength="8" autocomplete="current-password" required></label><label class="check"><input id="rememberLogin" type="checkbox"> 로그인 유지</label><button class="primary" id="authSubmit" type="submit">로그인</button><button class="link-button" id="authModeBtn" type="button">처음이신가요? 회원가입</button><div id="loginError" class="error" role="alert"></div><p class="help">서비스 개선을 위해 방문 화면, 기능 사용 및 오류 발생 여부를 기록합니다. 비밀번호와 입력 내용은 기록하지 않습니다.</p></form></div>
<div id="appView" class="app" hidden><header><div><small>안녕하세요</small><h1 id="userName">파트너님</h1></div><div class="header-actions"><button id="editHomeBtn" class="icon" type="button" hidden title="홈 화면 편집">✎</button><button id="refreshBtn" class="icon">↻</button></div></header><nav id="topNav"></nav><main id="content"></main><nav id="bottomNav"></nav></div>
<template id="homeTemplate"><section class="hero"><div class="hero-top"><span>오늘 현황</span><span id="heroPcBadge" class="hero-badge"><span class="dot"></span>확인 중</span></div><strong id="todayActivations">0건</strong><p class="hero-sub" id="heroSub"></p></section><div class="home-summary" id="homeSummary"><section class="kpis"><article class="removable" data-key="new-transfer" data-label="신규 양도"><button class="card-remove" type="button" aria-label="신규 양도 카드 숨기기">−</button><div class="kpi-head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17V7a2 2 0 0 1 2-2h7l7 7-7 7H6a2 2 0 0 1-2-2Z"/></svg>신규 양도</div><b id="newTransfer">0원</b></article><article class="removable" data-key="repurchase" data-label="재구매 양도"><button class="card-remove" type="button" aria-label="재구매 양도 카드 숨기기">−</button><div class="kpi-head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2.1 21 6l-4 3.9M3 12v-1a4 4 0 0 1 4-4h14M7 21.9 3 18l4-3.9M21 12v1a4 4 0 0 1-4 4H3"/></svg>재구매 양도</div><b id="repurchase">0원</b></article><article class="removable balance-flow" data-key="balance-flow" data-label="잔액 현황"><button class="card-remove" type="button" aria-label="잔액 현황 카드 숨기기">−</button><div class="kpi-head with-edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg><span>잔액 현황</span><button class="balance-edit-btn" id="balanceEditBtn" type="button" aria-label="잔액 수정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></button></div><div class="flow-row"><div class="flow-stat"><span>요금잔액</span><b id="balance">0원</b></div><div class="flow-stat right"><span>은행잔액</span><b id="bankBalance">0원</b></div></div></article></section><section class="card counter-card removable" data-key="attendance" data-label="앤보임"><button class="card-remove" type="button" aria-label="앤보임 카드 숨기기">−</button><div class="counter-row"><div><div class="kpi-head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>앤보임</div><small>오늘 출석</small></div><b id="attendance" class="value">0명</b></div></section><div class="add-tray" id="addTray" hidden></div></div><section class="card"><h2 class="card-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>오늘 할 일</h2><ol id="todayTasks"><li>등록된 할 일이 없습니다.</li></ol></section><section class="card"><h2 class="card-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>이번 달 현황</h2><div class="month-strip two-col" id="monthlyBasic"></div><div class="round-table"><table><thead><tr><th></th><th>자동매출</th><th>마감매출</th></tr></thead><tbody id="roundBody"></tbody><tfoot id="roundFoot"></tfoot></table></div></section></template>
