<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5b55b9"><title>NRC 사업관리</title><link rel="stylesheet" href="./css/app.css?v=20260829-57"></head><body>
<div id="loginView" class="auth"><form id="loginForm" class="auth-card"><div class="logo">NRC</div><h1>사업관리 시스템</h1><p id="authDescription">아이디와 비밀번호로 로그인하세요.</p><label class="signup-only" hidden>이름<input id="signupName" maxlength="40" autocomplete="name"></label><label class="signup-only" hidden>회원번호<input id="signupMemberNo" minlength="4" maxlength="20" inputmode="numeric" pattern="[0-9]+"></label><label>아이디<input id="loginUsername" minlength="4" maxlength="30" pattern="[A-Za-z0-9._-]+" autocomplete="username" autocapitalize="none" required></label><label>비밀번호<input id="loginPassword" type="password" minlength="8" autocomplete="current-password" required></label><label class="check"><input id="rememberLogin" type="checkbox"> 로그인 유지</label><button class="primary" id="authSubmit" type="submit">로그인</button><button class="link-button" id="authModeBtn" type="button">처음이신가요? 회원가입</button><div id="loginError" class="error" role="alert"></div></form></div>
<div id="appView" class="app" hidden><header><div><small>안녕하세요</small><h1 id="userName">파트너님</h1></div><button id="refreshBtn" class="icon">↻</button></header><nav id="topNav"></nav><main id="content"></main><nav id="bottomNav"></nav></div>
<template id="homeTemplate"><section class="hero"><span>오늘 현황</span><strong id="todayActivations">0건</strong></section><section class="kpis"><article><span>신규 양도</span><b id="newTransfer">0원</b></article><article><span>재구매 양도</span><b id="repurchase">0원</b></article><article><span>현재 잔액</span><b id="balance">0원</b></article><article><span>앤보임</span><b id="attendance">0명</b></article></section><section class="card"><h2>오늘 할 일</h2><ol id="todayTasks"><li>등록된 할 일이 없습니다.</li></ol></section><section class="card"><h2>이번 달 현황</h2><div id="monthlySummary" class="summary"></div></section></template>
<script type="module" src="./js/app.js?v=20260830-64"></script></body></html>
